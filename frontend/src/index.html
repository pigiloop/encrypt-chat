<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Chat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Экран авторизации -->
<div id="auth-screen" class="screen active">
    <div class="auth-container">
        <h1>Distributed Chat</h1>

        <div class="tabs">
            <button class="tab active" data-tab="login">Вход</button>
            <button class="tab" data-tab="register">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <form id="login-form" class="auth-form active">
            <input type="text" id="login-username" placeholder="Имя пользователя" required>
            <button type="submit">Войти</button>
        </form>

        <!-- Форма регистрации -->
        <form id="register-form" class="auth-form">
            <input type="text" id="register-username" placeholder="Имя пользователя" required>
            <input type="text" id="register-email" placeholder="E-Mail" required>
            <input type="text" id="register-first-name" placeholder="Имя" required>
            <input type="text" id="register-last-name" placeholder="Фамилия" required>
            <input type="text" id="register-age" placeholder="Возраст" required>

            <button type="submit">Зарегистрироваться</button>
        </form>

        <div id="auth-error" class="error"></div>
    </div>
</div>

<!-- Экран чата -->
<div id="chat-screen" class="screen">
    <div class="chat-container">
        <!-- Список пользователей слева -->
        <div class="users-sidebar">
            <div class="sidebar-header">
                <h2>Пользователи</h2>
                <button id="refresh-users-btn" class="btn-refresh" title="Обновить список">
                    ↻
                </button>
            </div>
            <div class="users-list" id="users-list">
                <!-- Пользователи будут добавляться динамически -->
            </div>
        </div>

        <!-- Область чата справа -->
        <div class="chat-area">
            <!-- Заголовок -->
            <div class="chat-header">
                <div class="user-info">
                    <span id="current-user-name">Пользователь</span>
                    <span class="status-indicator" id="connection-status"></span>
                </div>
                <button id="logout-btn" class="btn-logout">Выйти</button>
            </div>

            <!-- Информация о выбранном получателе -->
            <div class="chat-recipient" id="chat-recipient">
                <span class="recipient-label">Выберите пользователя для начала чата</span>
            </div>

            <!-- Область сообщений -->
            <div class="messages-container" id="messages">
                <div class="no-recipient-message">
                    👈 Выберите пользователя из списка слева
                </div>
            </div>

            <!-- Форма отправки сообщения -->
            <form id="message-form" class="message-form">
                <input
                        type="text"
                        id="message-input"
                        placeholder="Выберите получателя..."
                        required
                        autocomplete="off"
                        disabled
                >
                <button type="submit" disabled>Отправить</button>
            </form>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
